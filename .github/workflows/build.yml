name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sourcemod_plugins:
    runs-on: ubuntu-latest
    env:
      SM_BUILD: 1.12.0-git7255
    steps:
      - uses: actions/checkout@v4

      - name: SourceMod 1.12
        run: curl -fsSL "https://sm.alliedmods.net/smdrop/1.12/sourcemod-${SM_BUILD}-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"

      - name: Compile the plugins
        working-directory: cstrike/addons/sourcemod/scripting
        run: |
          mkdir -p "$RUNNER_TEMP/plugins"
          for sp in *.sp; do
            "$RUNNER_TEMP/addons/sourcemod/scripting/spcomp64" "$sp" \
              -i"$RUNNER_TEMP/addons/sourcemod/scripting/include" -E -o"$RUNNER_TEMP/plugins/${sp%.sp}.smx"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: ${{ runner.temp }}/plugins

  python_syntax:
    runs-on: ubuntu-latest
    container: python:2.7-slim
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax of WCS
        run: |
          find cstrike/addons/eventscripts -name '*.py' | while read f; do python -m py_compile "$f" || exit 1; done
          echo "all files compile"
